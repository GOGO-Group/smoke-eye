<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <canvas id="dial" width="168" height="168"></canvas>
    <div id="more" class="hidden">
      <div id="detail">
        <div id="opacity-panel" class="panel hidden">
          <input id="opacity" type="range" min="10" max="100" value="100" />
          <span id="opacity-val">100%</span>
        </div>

        <div id="proc-panel" class="panel hidden">
          <input id="filter" type="text" placeholder="filter…" />
          <ul id="proclist"></ul>
          <div id="settings">
            <button data-act="use">Use</button>
            <button data-act="refresh">Refresh</button>
          </div>
        </div>
      </div>

      <div id="more-menu">
        <button data-panel="opacity" title="Opacity" aria-label="Opacity">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor"/>
          </svg>
        </button>
        <button data-panel="proc" title="Process list" aria-label="Process list">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="9" y1="6" x2="20" y2="6"/>
            <line x1="9" y1="12" x2="20" y2="12"/>
            <line x1="9" y1="18" x2="20" y2="18"/>
            <circle cx="4.5" cy="6" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="4.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="4.5" cy="18" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <button data-act="settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button data-act="restore" title="Reset window" aria-label="Reset window">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/>
            <polyline points="3 4 3 9 8 9"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="toast"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
